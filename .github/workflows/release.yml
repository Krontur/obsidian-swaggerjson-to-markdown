name: Build, attest, and upload release assets

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag to rebuild, attest, and upload assets for"
                required: true

permissions:
    contents: write
    id-token: write
    attestations: write

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    release-assets:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name || inputs.tag }}

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Verify release tag matches manifest version
              run: |
                  node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8')); const tag=process.env.RELEASE_TAG; if (manifest.version !== tag) { throw new Error(`manifest.json version ${manifest.version} does not match release tag ${tag}`); }"
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

            - name: Run checks
              run: |
                  npm run lint
                  npm test

            - name: Build plugin
              run: npm run build

            - name: Generate artifact attestations
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Upload release assets
              run: gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
